# Erzeugt aus Conventional Commits einen Release-PR mit Versionsnummer und Changelog.
# Der Merge des Release-PR setzt den Tag v*, der in Phase 5 das Produktions-Deployment auslöst.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
