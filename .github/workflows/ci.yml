# Prüft jeden Pull Request vollständig; main muss grün bleiben.
# Staging und Produktion (Images pushen, Helm) folgen in Phase 5.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Spotless-Check, Kompilieren, Unit-, Slice-, Integrations- und Architekturtests, JaCoCo-Grenze
      - name: Build und Tests
        run: ./mvnw -B verify
      - name: Testberichte sichern
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-berichte
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
            backend/target/site/jacoco
            backend/target/spring-modulith-docs
          retention-days: 7

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  api-vertrag:
    name: api-vertrag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: openapi.json aus dem Backend erzeugen
        working-directory: backend
        run: ./mvnw -B -Popenapi -DskipTests verify
      - name: Mit dem Zielzweig vergleichen
        if: github.event_name == 'pull_request'
        run: |
          if ! git show "origin/${GITHUB_BASE_REF}:frontend/openapi.json" > "$RUNNER_TEMP/openapi-basis.json" 2>/dev/null; then
            echo "Auf ${GITHUB_BASE_REF} gibt es noch keinen API-Vertrag, der Vergleich entfällt."
            exit 0
          fi
          docker run --rm \
            -v "$RUNNER_TEMP:/basis" -v "$PWD/backend/target:/neu" \
            openapitools/openapi-diff:2.1.7 /basis/openapi-basis.json /neu/openapi.json --fail-on-incompatible
      - name: Client neu generieren und auf Abweichungen prüfen
        run: |
          cp backend/target/openapi.json frontend/openapi.json
          (cd frontend && pnpm install --frozen-lockfile && pnpm api:generate)
          if ! git diff --exit-code -- frontend/openapi.json frontend/src/shared/api; then
            echo "::error::openapi.json oder der generierte Client sind veraltet. Lokal 'pnpm api:sync' im Ordner frontend ausführen und committen."
            exit 1
          fi

  sicherheit:
    name: sicherheit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin, javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4
      - name: Secrets suchen (gitleaks)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose
      - name: Abhängigkeiten prüfen (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - name: Backend-Image bauen
        working-directory: backend
        run: ./mvnw -B -DskipTests spring-boot:build-image -Dspring-boot.build-image.imageName=debitoren-backend:local
      - name: Frontend-Image bauen
        run: docker build -t debitoren-frontend:local frontend
      - name: Compose-Stack starten
        run: docker compose -f deploy/compose/docker-compose.yml --profile app up -d --wait --wait-timeout 300
      - name: Playwright
        working-directory: e2e
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm test
      - name: Container-Logs sichern
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml --profile app logs --no-color > compose.log
      - name: Traces und Berichte sichern
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-berichte
          path: |
            e2e/playwright-report
            e2e/test-results
            compose.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Stack stoppen
        if: always()
        run: docker compose -f deploy/compose/docker-compose.yml --profile app down -v
